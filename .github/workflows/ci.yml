name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Admin editor JavaScript syntax
        run: find assets/js -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Capability picker regression
        run: node tests/js/capability-picker.test.mjs

      - name: Editor binding compatibility regression
        run: node tests/js/editor-binding-compatibility.test.mjs

      - name: Validation recovery regression
        run: node tests/js/validation-recovery.test.mjs

      - name: Human condition builder regression
        run: node tests/js/condition-builder.test.mjs

      - name: Shared Designer Shell regression
        run: node tests/js/designer-shell.test.mjs

      - name: Automation Builder maturity regression
        run: node tests/js/builder-maturity.test.mjs

      - name: Bootstrap requirements regression
        run: php tests/unit/bootstrap-requirements.php

      - name: Admin product surface regression
        run: php tests/unit/admin-product-surface.php

      - name: AU2 runtime bootstrap boundary
        run: php tests/unit/runtime-bootstrap.php

      - name: AU2 execution authority policy
        run: php tests/unit/execution-authority.php

      - name: AU2 runtime schema v2
        run: php tests/unit/runtime-schema.php

      - name: AU2 Runtime Vault
        run: php tests/unit/runtime-vault.php

      - name: AU2 queue state machine
        run: php tests/unit/queue-state-machine.php

      - name: AU2 queue datetime hydration contract
        run: php tests/unit/job-datetime-contract.php

      - name: AU2 trigger intake and fan-out
        run: php tests/unit/runtime-intake.php

      - name: AU2 G1 intake concurrency proof
        run: php tests/unit/runtime-g1.php

      - name: AU2 State execution slice
        run: php tests/unit/runtime-state-execution.php

      - name: AU2 Condition execution slice
        run: php tests/unit/runtime-condition-execution.php

      - name: AU2 Action execution slice
        run: php tests/unit/runtime-action-execution.php

      - name: AU2 durable run pipeline
        run: php tests/unit/runtime-run-pipeline.php

      - name: Golden LMS to Certificates runtime
        run: php tests/unit/golden-runtime.php

      - name: AU2 crash and recovery fencing
        run: php tests/unit/runtime-crash-recovery.php

      - name: AU2 G2 adversarial runtime matrix
        run: php tests/unit/runtime-g2.php

      - name: AU2 metadata-only run observability
        run: php tests/unit/runtime-observability.php

      - name: AU2.9 operator recovery
        run: php tests/unit/runtime-operator-recovery.php

      - name: AU2.9 operator Runs access closure
        run: php tests/unit/runtime-operator-access.php

      - name: Workflow definition invariants
        run: php tests/unit/definition-invariants.php

      - name: Workflow core regression matrix
        run: php tests/unit/workflow-core.php

      - name: Hostile codec regression matrix
        run: php tests/unit/codec-hostile.php

      - name: Privacy persistence regression
        run: php tests/unit/privacy-policy.php

      - name: Editor privacy projection regression
        run: php tests/unit/editor-projection.php

      - name: Independent proof workflows
        run: php tests/unit/proof-workflows.php

      - name: Golden provider workflow
        run: php tests/unit/golden-provider-set.php

      - name: Demo provider registration contract
        run: php tests/unit/demo-provider-contract.php

      - name: Architecture regression guard
        run: php tests/unit/architecture.php
