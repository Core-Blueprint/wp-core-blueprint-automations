name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare immutable Base contract fixtures
        run: bash tools/prepare-base-fixtures --prepare

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.cb-base-fixtures/*' -print0 | xargs -0 -r -n1 php -l

      - name: JavaScript runtime syntax
        run: find assets/js -type f -name '*.js' -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Full PHP and JavaScript regression matrix
        run: bash tools/test-regressions

      - name: Build installable development ZIP
        if: matrix.php == '8.4'
        run: |
          bash tools/build-release
          unzip -tqq dist/core-blueprint-automations-1.0.0-rc2.zip
          (cd dist && sha256sum -c core-blueprint-automations-1.0.0-rc2.zip.sha256)

      - name: Upload WordPress install ZIP
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: core-blueprint-automations-adv03a-wordpress-install
          path: |
            dist/core-blueprint-automations-1.0.0-rc2.zip
            dist/core-blueprint-automations-1.0.0-rc2.zip.sha256
          if-no-files-found: error
          retention-days: 14
